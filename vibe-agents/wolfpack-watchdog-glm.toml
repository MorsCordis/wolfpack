# Tracked template — install with scripts/wolfpack-install-vibe-agents.mjs; do not hand-edit the installed copy.
# Wolfpack GLM seat (watchdog). Run ONLY via the pack's podman-vibe.sh shim, which passes
# --auto-approve + a strict --enabled-tools allow-list
# (read_file grep bash write_file dev_cortex_repo_map dev_cortex_file_outline).
# vibe -p hangs forever on any tool call needing approval, so nothing here is "ask".
active_model = "glm-5.3"  # zai-glm-5-3 via the Mistral API
agent_type = "agent"
display_name = "Wolfpack Watchdog (GLM 5.3)"
description = "Certifier — read-only source, GLM seat (writes its handoff files to the shim out dir)"
system_prompt_id = "wolfpack-watchdog"

[tools.read_file]
permission = "always"

[tools.grep]
permission = "always"

[tools.dev_cortex_repo_map]
permission = "always"

[tools.dev_cortex_file_outline]
permission = "always"

# bash runs inside the sandbox: worktree and git dir mounted read-only, no prod
# credentials (doc 06: the sandbox is the guardrail). The seat must be able to run
# `git diff` and the project's test command. git_bash is Vibe's Windows-only shell
# companion; it mirrors bash.
[tools.bash]
permission = "always"

[tools.git_bash]
permission = "always"

# write_file is allowed ONLY for the seat's own handoff file (seat-handoff-writes): the shim
# mounts ONE per-seat out dir read-write (<plan dir>/.seat-out/<seat>-r<N>/); the worktree
# stays read-only, the shim moves only the expected artifact into the plan dir, and anything
# else (an extra file, a source change) fails the round. edit stays never: edit-denied by role
# (the shim also drops it from the allow-list). task stays never: no self-orchestration (the
# pipeline owns fan-out).
[tools.edit]
permission = "never"

[tools.write_file]
permission = "always"

[tools.task]
permission = "never"
